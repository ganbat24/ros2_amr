bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    default_bt_xml_filename: "navigate_w_replanning_and_recovery.xml"
    # nav2 1.3.x auto-loads the built-in BT plugin libraries and defaults
    # plugin_lib_names accordingly; listing them explicitly caused
    # "ID [...] already registered" and crashed bt_navigator. Omit it.

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: True
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      # Slight reverse allowed: with min_vel_x 0.0 the robot cannot back
      # out of an obstacle's inflation zone once wedged ("no legal
      # trajectories" forever; recoveries also fail).
      min_vel_x: -0.2
      min_vel_y: 0.0
      max_vel_x: 0.5
      max_vel_y: 0.0
      max_vel_theta: 1.9
      min_speed_xy: 0.0
      max_speed_xy: 0.5
      min_speed_theta: 0.0
      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 2.2
      linear_granularity: 0.05
      angular_granularity: 0.025
      xy_goal_tolerance: 0.25
      path_length_tolerance: 1.0
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      # 0.05 made the obstacle critic nearly inert: the robot hugged
      # O1/wall inflation because path critics dominated. 0.2 keeps
      # obstacle cost meaningful without starving path following.
      BaseObstacle.scale: 0.2
      PathAlign.scale: 32.0
      # Goal critics at 24 were almost as strong as the path critics (32):
      # near the path's east turn under W1a, the goal pull (north) won and
      # the robot cut the corner into the wall's inflation ("Start
      # occupied"). 6.0 keeps the goal relevant only near the goal.
      GoalAlign.scale: 6.0
      # Look further ahead along the path so corner cutting into obstacle
      # inflation is penalized (0.1 m let the robot drift into walls/O1;
      # 0.3 m still oscillated across the path near the D1 door — the
      # cross-track correction overshot into W1a's inflation and the
      # robot detoured south of the door). 0.8 m smooths the correction.
      PathAlign.forward_point_distance: 0.8
      GoalAlign.forward_point_distance: 0.8
      PathDist.scale: 32.0
      # see GoalAlign.scale note above
      GoalDist.scale: 6.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.125
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: -1
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      # 2.0 let the path hug inflated cells around obstacle corners
      # (0.3 m from O1's west face, inside the 0.35 m inflation) — the
      # DWB's cross-track slop then wedged the robot into the lethal
      # zone. 4.0 pushes the path toward clear cells.
      cost_travel_multiplier: 4.0

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 1.9]
    min_velocity: [-0.5, 0.0, -1.9]
    max_accel: [1.0, 0.0, 3.2]
    max_decel: [-1.0, 0.0, -3.2]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 1.0
      update_frequency: 1.0
      publish_frequency: 1.0
      rolling_window: false
      # Fixed window sized to cover the whole amr_office map from the
      # robot's spawn pose: with rolling_window=false the costmap origin
      # is anchored at (spawn - size/2), so a 100x100 (5x5 m) window only
      # reached ~[-1,4]x[-1,4] — goals beyond it were "no valid path".
      # 400x320 (20x16 m) covers the 11x9 m map from the (1.5, 1.5) spawn
      # with margin. Keep in sync with the world/map dimensions.
      width: 400
      height: 320
      resolution: 0.05
      robot_radius: 0.25
      # Static + inflation only: the occupancy map already contains every
      # wall/obstacle. The scan-based obstacle layer is redundant here and
      # harmful — under sim-time TF lag its transformed points smear around
      # a turning robot ("Start occupied" / phantom walls). The local
      # costmap keeps the obstacle layer for near-field collision checks.
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        subscribe_to_updates: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # 0.35 m (robot radius 0.25 + 0.1): a 0.5 m inflation made every
        # 1.4-1.6 m door opening nearly impassable and left no room for
        # DWB recoveries once near a wall.
        inflation_radius: 0.35
      # (global costmap: static + inflation only — see plugins above)

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 1.0
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.25
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35

lifecycle_manager:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names: ["controller_server", "planner_server", "smoother_server", "behavior_server", "bt_navigator", "velocity_smoother"]
