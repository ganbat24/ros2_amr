bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    # default_bt_xml_filename is a ROS1/older-nav2 name; this nav2
    # release's plugin-based navigators each have their own param
    # (default_nav_to_pose_bt_xml / default_nav_through_poses_bt_xml,
    # confirmed against the installed libnav2_navigate_to_pose_
    # navigator.so). This default is overridden at launch time by
    # amr_navigation/launch/navigation.launch.py's RewrittenYaml rewrite;
    # kept here too so loading this file directly still resolves to a
    # real file instead of nav2_bringup's now-nonexistent
    # behavior_trees/navigate_w_replanning_and_recovery.xml.
    default_nav_to_pose_bt_xml: "navigate_to_pose_w_replanning_and_recovery.xml"
    # nav2's default is 20 ms — how long a BT action node waits for its
    # server (controller/planner/behaviour) to ACKNOWLEDGE a goal. That is a
    # tight window on a host running the sim below real time under software
    # rendering, and when it expires the BT aborts the whole navigation goal
    # with "Timed out while waiting for action server to acknowledge".
    #
    # Measured 2026-08-14: a g3 that failed at (7.07, 4.78) logged exactly one
    # warning for the whole goal — that timeout — with zero "No valid
    # trajectories" and zero "Failed to make progress". The robot was
    # navigating fine; the acknowledgement just did not arrive in 20 ms.
    #
    # This only changes how patient the BT is with a busy server. It does not
    # affect planning or control behaviour.
    default_server_timeout: 200
    # nav2 1.3.x auto-loads the built-in BT plugin libraries and defaults
    # plugin_lib_names accordingly; listing them explicitly caused
    # "ID [...] already registered" and crashed bt_navigator. Omit it.

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      # 10.0 was tuned on the 2-vCPU host; on live WSL2 runs the robot was
      # observed oscillating/slow-progressing near the W2 door corner while
      # spin/backup/wait recoveries each "completed successfully" without
      # resolving the stall — the checker was firing before those recoveries
      # got a real chance to help. 20.0 gives more slack before declaring
      # failure and entering another recovery cycle. Observed harmless, but
      # it did not by itself convert any failing goal — do not credit it
      # with more than it earned.
      movement_time_allowance: 20.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: True
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      # Slight reverse allowed: with min_vel_x 0.0 the robot cannot back
      # out of an obstacle's inflation zone once wedged ("no legal
      # trajectories" forever; recoveries also fail).
      min_vel_x: -0.2
      min_vel_y: 0.0
      max_vel_x: 0.5
      max_vel_y: 0.0
      max_vel_theta: 1.9
      min_speed_xy: 0.0
      max_speed_xy: 0.5
      min_speed_theta: 0.0
      # 2.5 is nav2's reference; 1.0 throttled how fast DWB could ramp
      # up within a control cycle.
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      # 1.7 is nav2's reference. 2.2 projected 1.1 m ahead at full speed,
      # which in this world's doorways put most fast trajectories into
      # inflation.
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      xy_goal_tolerance: 0.25
      path_length_tolerance: 1.0
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      # 0.05 made the obstacle critic nearly inert: the robot hugged
      # O1/wall inflation because path critics dominated. 0.2 keeps
      # obstacle cost meaningful without starving path following.
      # (Tried 0.4 on WSL2 chasing a door-corner wedging failure; a single
      # tour showed no measurable improvement over 0.2, so reverted rather
      # than keep an unproven deviation from this carefully-tuned baseline.)
      BaseObstacle.scale: 0.2
      # The Align critics are DISABLED, matching nav2's own shipped DWB
      # reference (nav2_bringup/params/nav2_multirobot_params_1.yaml sets
      # both to 0.0). They were 32.0 and 6.0 here, and that was the reason
      # the robot crawled everywhere.
      #
      # Why they break it: PathAlign scores how far a trajectory's forward
      # projection lands from the path. A trajectory that does not move has
      # zero deviation, so it scores 0 — a perfect score no moving
      # trajectory can beat. Measured from DWB's own /evaluation topic, the
      # stationary choice scored 16.40 while the best moving candidate
      # scored 25.10, of which PathAlign contributed +17.60. Standing still
      # was a local optimum, and the controller sat in it: mean commanded
      # velocity 0.015 m/s against a max_vel_x of 0.5.
      #
      # Corner-cutting — what these critics were raised to fix — is the
      # obstacle critic's job (BaseObstacle above) and the planner's, not
      # the alignment critics'.
      PathAlign.scale: 0.0
      GoalAlign.scale: 0.0
      # Irrelevant while the scales are 0; kept at nav2's default so the
      # critics behave normally if anyone re-enables them.
      PathAlign.forward_point_distance: 0.1
      GoalAlign.forward_point_distance: 0.1
      # The Dist critics are what reward progress toward the path and goal.
      # nav2's reference is 32.0 / 24.0; GoalDist was 6.0 here, which left
      # almost nothing pulling the robot forward once Align was removed.
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ["GridBased"]
    GridBased:
      # planner_server logs one ERROR at configure: "Inflation layer either
      # not found or inflation is not set sufficiently for optimized
      # non-circular collision checking capabilities". It is benign here, and
      # this is the measurement rather than the assumption (2026-08-14):
      #
      #   inflation_radius | 0.55 | 0.70 | 1.00 | 1.50
      #   warnings emitted |   1  |   1  |   1  |   1
      #
      # Invariant to the value across a 3x sweep, so it is not reporting an
      # inflation misconfiguration. It fires inside SmacPlanner2D::configure,
      # ~20 ms after the inflation layer initialises and before the costmap is
      # activated — the layer has not built its cost cache yet at that point.
      # The optimisation it refers to is the potential-field shortcut that lets
      # an SE2 planner skip full-footprint checks; SmacPlanner2D plans for a
      # circular robot (robot_radius 0.25, footprint empty), so it never uses
      # that path. Do not raise inflation_radius to silence it — that changes
      # real navigation behaviour to quiet a message about a code path this
      # planner does not take.
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.125
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: -1
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      # 2.0 let the path hug inflated cells around obstacle corners
      # (0.3 m from O1's west face, inside the 0.35 m inflation) — the
      # DWB's cross-track slop then wedged the robot into the lethal
      # zone. 4.0 pushes the path toward clear cells.
      # On WSL2, live runs showed the planner replanning every ~1s and
      # flip-flopping between two path solutions near the D1/W2 door
      # corners — consistent with two routes sitting at close to equal
      # cost so a small change in start pose or costmap noise between
      # replans tips A* to the other one each time. 6.0 breaks that tie
      # harder. Evidence is WEAK — a single-tour positive signal, not a
      # repeated measurement; revisit under a proper multi-run campaign
      # before treating 6.0 as established.
      cost_travel_multiplier: 6.0

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 1.9]
    min_velocity: [-0.5, 0.0, -1.9]
    max_accel: [1.0, 0.0, 3.2]
    max_decel: [-1.0, 0.0, -3.2]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 1.0
      update_frequency: 1.0
      publish_frequency: 1.0
      rolling_window: false
      # Fixed window sized to cover the whole amr_office map from the
      # robot's spawn pose: with rolling_window=false the costmap origin
      # is anchored at (spawn - size/2), so a 100x100 (5x5 m) window only
      # reached ~[-1,4]x[-1,4] — goals beyond it were "no valid path".
      # 400x320 (20x16 m) covers the 11x9 m map from the (1.5, 1.5) spawn
      # with margin. Keep in sync with the world/map dimensions.
      width: 400
      height: 320
      resolution: 0.05
      robot_radius: 0.25
      # Static + inflation only: the occupancy map already contains every
      # wall/obstacle. The scan-based obstacle layer is redundant here and
      # harmful — under sim-time TF lag its transformed points smear around
      # a turning robot ("Start occupied" / phantom walls). The local
      # costmap keeps the obstacle layer for near-field collision checks.
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        subscribe_to_updates: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # 0.55 m, nav2's reference value. It was 0.35 (robot radius + 0.1) on
        # the belief that a wider inflation made the 1.4-1.6 m doors
        # impassable. It does not: cells within robot_radius (0.25) are
        # inscribed and hard-vetoed; everything beyond that is graded COST,
        # not a block. The hard-passable band through a 1.6 m door stays
        # 1.6 - 2(0.25) = 1.1 m whatever the inflation radius is, and the
        # door centre sits 0.8 m from each wall — beyond 0.55, so zero
        # inflation cost.
        #
        # What 0.35 did cost was the gradient. Past 0.36 m from a wall every
        # cell was equally free, so nothing pulled the robot toward open
        # space and it tracked along walls. Measured 2026-08-14, a failed g3
        # left the robot at (7.47, 5.13) — 0.23 m from the W2 wall face,
        # inside the inscribed radius, where every trajectory is vetoed
        # ("No valid trajectories out of 440") and the next goal then aborts
        # instantly on an in-collision start.
        inflation_radius: 0.55
      # (global costmap: static + inflation only — see plugins above)

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 1.0
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.25
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # Keep in step with the global costmap — see the note there.
        inflation_radius: 0.55

lifecycle_manager:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names: ["controller_server", "planner_server", "smoother_server", "behavior_server", "bt_navigator", "velocity_smoother"]
