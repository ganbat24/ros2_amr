amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.2
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_link
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9
    do_beamskip: false
    global_frame_id: map
    lambda: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 8.0
    laser_min_range: 0.1
    laser_model_type: likelihood_field
    # CPU-cost levers for constrained hosts (2 vCPU + software rendering):
    # AMCL's message filter queues at 10 msgs; at 10 Hz scans it cannot keep
    # up ("queue is full" drops) and never publishes a pose. Halve the beam
    # count, gate updates on motion, and resample every 2nd update.
    max_beams: 30
    update_min_d: 0.5
    update_min_a: 0.5
    resample_interval: 2
    laser_z_hit: 0.95
    laser_z_max: 0.05
    laser_z_rand: 0.5
    laser_z_short: 0.05
    laser_sigma_hit: 0.2
    link_min_dist: 0.2
    link_max_dist: 2.0
    link_match_minimum_response_fine: 0.1
    odom_model_type: diff
    odom_alpha1: 0.2
    odom_alpha2: 0.2
    odom_alpha3: 0.2
    odom_alpha4: 0.2
    odom_alpha5: 0.2
    initial_cov_xx: 0.25
    initial_cov_yy: 0.25
    initial_cov_aa: 0.0685
    # nav2 1.3.12 renamed the initial-pose params to initial_pose.* (the old
    # flat initial_pose_x/y/a keys are gone and silently ignored), and AMCL
    # only uses them when set_initial_pose is true — otherwise it warns
    # "cannot publish a pose" and stays silent until an /initialpose arrives.
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    max_particles: 2000
    min_particles: 500
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    scan_topic: /scan
    map_topic: /map
    odom_topic: /odom
    transform_tolerance: 1.0
