amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.2
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_link
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9
    do_beamskip: false
    global_frame_id: map
    laser_likelihood_max_dist: 2.0
    laser_max_range: 8.0
    laser_min_range: 0.1
    laser_model_type: likelihood_field
    # CPU-cost levers were set for the 2-vCPU host at RTF 1.0 (max_beams
    # 30, update_min_d/a 0.5, resample_interval 2). With RTF 0.5 there is
    # headroom: tighter update gates keep AMCL tracking through door
    # crossings (0.5 m/0.5 rad gates let it fall 0.3-1 m behind during
    # turns, which broke the costmap robot pose and all nav goals).
    # 2026-08-12: 0.15 m/0.15 rad gates still left a systematic ~0.35 m
    # lag (median error 0.345 m, all along-track): scan_restamp backdates
    # scans to AMCL's own map->odom TF time, so AMCL never sees data
    # fresher than its last update. 0.08 m/0.08 rad updates shrink the
    # loop, and transform_tolerance 0.3 (was 1.0) stops the filter
    # integrating scans more than 0.3 s stale.
    max_beams: 40
    update_min_d: 0.08
    update_min_a: 0.08
    resample_interval: 1
    # nav2_amcl's laser-model params have no laser_/odom_ prefix (that was
    # the ROS1 amcl naming): z_hit/z_max/z_rand/z_short/sigma_hit and
    # lambda_short, verified against the installed nav2_amcl binary
    # (`strings libamcl_core.so`). The old laser_z_hit/laser_sigma_hit/
    # lambda keys here were never declared by the node, so they were
    # silently ignored and AMCL ran the laser model on its defaults.
    z_hit: 0.95
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    sigma_hit: 0.2
    lambda_short: 0.1
    # AMCL's initial-pose params are set_initial_pose (bool) + the nested
    # initial_pose.{x,y,z,yaw} block — the long-standing API (predates
    # Galactic). Flat keys like initial_pose_x are never declared and are
    # silently ignored. AMCL only uses the params when set_initial_pose is
    # true — otherwise it warns "cannot publish a pose" and stays silent
    # until an /initialpose arrives.
    #
    # There is no initial-covariance parameter: nav2_amcl declares none, so
    # initial_cov_xx/yy/aa (ROS 1 names) were silently dropped at load. The
    # initial spread comes from the /initialpose message's covariance, or
    # from the filter's own defaults. Don't re-add them.
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    max_particles: 2000
    min_particles: 500
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    # scan_topic and map_topic are declared; there is no odom_topic — AMCL
    # takes odometry from TF (odom -> base_frame_id), not from a topic.
    scan_topic: /scan
    map_topic: /map
    transform_tolerance: 0.3
