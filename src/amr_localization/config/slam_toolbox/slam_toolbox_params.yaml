slam_toolbox:
  ros__parameters:
    use_sim_time: true
    mode: mapping

    # Frames. slam_toolbox takes odometry from TF (odom_frame -> base_frame),
    # not from a topic: there is no odom_topic/imu_topic parameter, and the
    # ones that used to be here were silently ignored at load.
    base_frame: base_link
    odom_frame: odom
    map_frame: map
    scan_topic: /scan
    # scan_queue_size is the real name (default 1). The map topic is fixed —
    # remap it in the launch file if it ever needs to move.
    scan_queue_size: 5
    transform_timeout: 0.2

    resolution: 0.05
    minimum_time_interval: 0.5
    stack_size_to_use: 40000000
    debug_logging: false

    # Scan matching / correlation
    correlation_search_space_dimension: 0.2
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 0.5

    # Loop closure
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
    link_match_minimum_response_fine: 0.1
    # link_scan_maximum_distance is the real name (was link_scan_maximum_range).
    link_scan_maximum_distance: 12.0
