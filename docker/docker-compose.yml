# docker/docker-compose.yml
# Containerised simulation, RViz and teleop.
#
# WHICH ENVIRONMENT IS THIS FOR?
#   The container exists for reproducible builds and CI parity. The primary
#   place to actually run the simulation is a native ROS 2 install on a
#   machine with enough cores (WSL2 here). Running the full stack in this
#   container on a small host is possible but starved, and performance
#   conclusions drawn there are not valid.
#
# Usage:
#   docker compose -f docker/docker-compose.yml up sim     # Gazebo + EKF + AMCL
#   docker compose -f docker/docker-compose.yml up rviz    # RViz against sim
#   docker compose -f docker/docker-compose.yml up teleop  # Keyboard teleop
#
# SLAM mapping mode: docker compose exec sim ros2 launch amr_bringup
#   system.launch.py use_slam:=true
#
# RENDERING — decide per host, do not copy a setting between environments.
#   Gazebo's gpu_lidar needs a GL context. Whether to force software rendering
#   depends on whether the host has a usable GL driver:
#
#     LIBGL_ALWAYS_SOFTWARE=1   required where there is no driver (CI, a
#                               headless server, WSL2 without working GPU
#                               passthrough). Slow enough to affect sensor
#                               timing — expect degraded scan rates.
#     unset                     correct where a real driver is present. Forcing
#                               software on top of a working driver makes
#                               gpu_lidar segfault with
#                               "SceneManager.cc: Scene already exists".
#
#   Check before choosing:  glxinfo -B | grep 'OpenGL renderer'
#   ("llvmpipe" means you are already on software.)
#
#   Set it explicitly for this stack via AMR_SOFTWARE_RENDER=1 (default: unset,
#   i.e. use whatever the host provides). The /dev/dri passthrough below is a
#   no-op on hosts without a render node.

services:
  sim:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: amr-ws:jazzy
    container_name: amr_sim
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - XAUTHORITY=/tmp/.docker.xauth
      - QT_X11_NO_MITSHM=1
      - GZ_SIM_RESOURCE_PATH=/ros2_ws/install/amr_simulation/share/amr_simulation
      - AMR_GZ_HEADLESS=${AMR_GZ_HEADLESS:-false}
      # See the RENDERING note at the top of this file before setting this.
      - LIBGL_ALWAYS_SOFTWARE=${AMR_SOFTWARE_RENDER:-}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-/tmp/.docker.xauth}:/tmp/.docker.xauth:rw
      - ../src:/ros2_ws/src:ro
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
    network_mode: host
    ipc: host
    command: >
      ros2 launch amr_bringup system.launch.py
        use_sim_time:=true
        world:=/ros2_ws/src/amr_simulation/worlds/amr_office.sdf
        headless:=${AMR_GZ_HEADLESS:-false}
    stdin_open: true
    tty: true
    restart: "no"

  rviz:
    image: amr-ws:jazzy
    container_name: amr_rviz
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - XAUTHORITY=/tmp/.docker.xauth
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-/tmp/.docker.xauth}:/tmp/.docker.xauth:rw
      - ../src:/ros2_ws/src:ro
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
    network_mode: host
    ipc: host
    command: >
      ros2 run rviz2 rviz2
        -d /ros2_ws/src/amr_bringup/rviz/amr_navigation.rviz
        --ros-args -p use_sim_time:=true
    stdin_open: true
    tty: true
    restart: "no"

  teleop:
    image: amr-ws:jazzy
    container_name: amr_teleop
    environment:
    network_mode: host
    ipc: host
    stdin_open: true
    tty: true
    restart: "no"
    command: >
      ros2 run teleop_twist_keyboard teleop_twist_keyboard
        --ros-args -p stamped:=false -r cmd_vel:=/cmd_vel
