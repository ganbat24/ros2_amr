name: CI

on: [push, pull_request]

jobs:
  ci:
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy-ros-base-noble

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache rosdep
        uses: actions/cache@v5
        with:
          path: ~/.ros/rosdep
          key: rosdep-${{ runner.os }}-jazzy
          restore-keys: |
            rosdep-${{ runner.os }}-jazzy-

      - name: Install system dependencies
        run: |
          set -e
          apt-get update
          apt-get install -y \
            ccache \
            curl \
            gnupg \
            lsb-release \
            python3-rosdep \
            python3-colcon-common-extensions \
            python3-pip \
            python3-pytest \
            python3-yaml
          apt-get update
          apt-get install -y \
            ros-jazzy-ros-gz \
            ros-jazzy-gz-ros2-control

      - name: Configure ccache
        run: |
          ccache --max-size=1G
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: rosdep install
        run: |
          . /opt/ros/jazzy/setup.sh
          rosdep update || true
          rosdep install --from-paths src --ignore-src -r -y

      - name: Build
        run: |
          . /opt/ros/jazzy/setup.sh
          colcon build \
            --symlink-install \
            --cmake-args -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            --event-handlers console_cohesion+

      - name: Lint (fast fail)
        run: |
          . /opt/ros/jazzy/setup.sh
          colcon test \
            --ctest-args -R lint_ \
            --event-handlers console_cohesion+

      - name: Test (runtime only)
        run: |
          . /opt/ros/jazzy/setup.sh
          colcon test \
            --ctest-args -E lint_ \
            --event-handlers console_cohesion+

      - name: Test results
        if: always()
        run: |
          . /opt/ros/jazzy/setup.sh
          if [ -d build ]; then colcon test-result --verbose; else echo "No build directory found - skipping test results"; fi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: colcon-test-results
          path: |
            build/**/test_results/**
            log/**/**
