name: AMR Base Stack CI

on: [push, pull_request]

jobs:
  ament_lint:
    runs-on: ubuntu-latest
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y \
            ros-jazzy-ament-cmake \
            ros-jazzy-ament-lint \
            python3-yaml
      - name: Run ament_lint_auto
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select amr_description amr_control amr_simulation amr_sensors amr_localization amr_navigation amr_bringup --cmake-args -DCMAKE_BUILD_TYPE=Release
          # lint runs during build

  colcon_test:
    runs-on: ubuntu-latest
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y \
            ros-jazzy-ament-cmake \
            ros-jazzy-ament-launch-test \
            python3-yaml
      - name: Run colcon test
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test --packages-select amr_description amr_control amr_simulation amr_sensors amr_localization amr_navigation amr_bringup
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colcon-test-results
          path: |
            amr_ws/build/**/test_results/**
            amr_ws/log/**/**
