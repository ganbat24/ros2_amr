name: CI

on: [push, pull_request]

jobs:
  ci:
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy-ros-base-noble
      env:
        # GPU-less runner: force Mesa software rendering (llvmpipe) so
        # Gazebo's gpu_lidar sensor can create a GL context headless.
        LIBGL_ALWAYS_SOFTWARE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache rosdep
        uses: actions/cache@v6
        with:
          path: ~/.ros/rosdep
          key: rosdep-${{ runner.os }}-jazzy
          restore-keys: |
            rosdep-${{ runner.os }}-jazzy-

      - name: Cache colcon
        uses: actions/cache@v6
        with:
          path: ~/.colcon
          key: colcon-${{ runner.os }}-jazzy-${{ hashFiles('src/**/CMakeLists.txt') }}
          restore-keys: |
            colcon-${{ runner.os }}-jazzy-

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-jazzy-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-jazzy-

      - name: Install system dependencies
        run: |
          set -e
          apt-get update
          apt-get install -y \
            ccache \
            curl \
            git \
            gnupg \
            lsb-release \
            libegl-mesa0 \
            libgl1-mesa-dri \
            python3-rosdep \
            python3-colcon-common-extensions \
            python3-pip \
            python3-pytest \
            python3-yaml
          apt-get update
          apt-get install -y \
            ros-jazzy-ros-gz \
            ros-jazzy-gz-ros2-control

      - name: Configure ccache
        run: |
          ccache --max-size=1G
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: Configure CycloneDDS
        # The full stack spawns 40+ nodes; without a raised participant
        # index space CycloneDDS exhausts the default and gz_ros2_control
        # segfaults at the first controller read (nil deref).
        run: |
          cat > /etc/cyclonedds.xml <<'EOF'
          <CycloneDDS xmlns="https://cyclonedds.io/schemas/cyclonedds/1.0">
            <Domain>
              <General>
                <Interfaces>
                  <NetworkInterface name="eth0"/>
                </Interfaces>
                <AllowMulticast>true</AllowMulticast>
                <EnableMulticastLoopback>true</EnableMulticastLoopback>
              </General>
              <Discovery>
                <ParticipantIndex>auto</ParticipantIndex>
                <MaxAutoParticipantIndex>200</MaxAutoParticipantIndex>
              </Discovery>
            </Domain>
          </CycloneDDS>
          EOF
          echo "CYCLONEDDS_URI=file:///etc/cyclonedds.xml" >> "$GITHUB_ENV"

      - name: Overlay gz_ros2_control (jazzy-branch fix)
        # The 1.2.19 binary segfaults at the first controller read
        # (upstream bug); the jazzy branch carries the fix. Build the
        # pinned tip (plus the empty-data guard patch, see
        # docker/patches/) into the workspace so CI runs the same code
        # the Docker image ships.
        run: |
          git init src/gz_ros2_control
          cd src/gz_ros2_control
          git remote add origin https://github.com/ros-controls/gz_ros2_control.git
          git fetch --depth 1 origin 4047614cfa89d8b77df68d64859d95c3288a3a2e
          git checkout --detach FETCH_HEAD
          git apply /__w/ros2_amr/ros2_amr/docker/patches/gz_ros2_control-empty-data-guard.patch

      - name: rosdep install
        run: |
          . /opt/ros/jazzy/setup.sh
          rosdep update || true
          rosdep install --from-paths src --ignore-src -r -y

      - name: Build
        run: |
          . /opt/ros/jazzy/setup.sh
          cmake_args="-DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          colcon build \
            --symlink-install \
            --cmake-args $cmake_args \
            --event-handlers console_cohesion+

      - name: Lint (fast fail)
        run: |
          . /opt/ros/jazzy/setup.sh
          . ./install/setup.sh
          colcon test \
            --packages-skip gz_ros2_control gz_ros2_control_tests gz_ros2_control_demos \
            --ctest-args -R lint_ \
            --event-handlers console_cohesion+

      - name: Test (runtime only)
        run: |
          . /opt/ros/jazzy/setup.sh
          # workspace install must be on the ament path: the launch tests
          # xacro the URDF, which resolves $(find amr_control) and friends
          . ./install/setup.sh
          # gz_ros2_control{, _tests, _demos} are the VENDORED overlay
          # (built from the pinned jazzy tip + guard patch): its own tests
          # need gz sim / upstream tooling and are not this repo's
          # responsibility — the Build step still compiles them. Test only
          # the 7 amr packages.
          colcon test \
            --packages-skip gz_ros2_control gz_ros2_control_tests gz_ros2_control_demos \
            --ctest-args -E lint_ \
            --event-handlers console_cohesion+

      - name: Test results
        if: always()
        run: |
          . /opt/ros/jazzy/setup.sh
          if [ -d build ]; then colcon test-result --verbose; else echo "No build directory found - skipping test results"; fi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: colcon-test-results
          path: |
            build/**/test_results/**
            log/**/**
