name: CI

on: [push, pull_request]

jobs:
  ci:
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy-ros-base-noble
      env:
        # GPU-less runner: force Mesa software rendering (llvmpipe) so
        # Gazebo's gpu_lidar sensor can create a GL context headless.
        LIBGL_ALWAYS_SOFTWARE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}

      - name: Cache rosdep
        uses: actions/cache@v5
        with:
          path: ~/.ros/rosdep
          key: rosdep-${{ runner.os }}-jazzy
          restore-keys: |
            rosdep-${{ runner.os }}-jazzy-

      - name: Cache colcon
        uses: actions/cache@v5
        with:
          path: ~/.colcon
          key: colcon-${{ runner.os }}-jazzy-${{ hashFiles('src/**/CMakeLists.txt') }}
          restore-keys: |
            colcon-${{ runner.os }}-jazzy-

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-jazzy-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-jazzy-

      - name: Install system dependencies
        run: |
          set -e
          apt-get update
          apt-get install -y \
            ccache \
            curl \
            gnupg \
            lsb-release \
            libegl-mesa0 \
            libgl1-mesa-dri \
            python3-rosdep \
            python3-colcon-common-extensions \
            python3-pip \
            python3-pytest \
            python3-yaml
          apt-get update
          apt-get install -y \
            ros-jazzy-ros-gz \
            ros-jazzy-gz-ros2-control

      - name: Configure ccache
        run: |
          ccache --max-size=1G
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: Detect changed packages
        id: changed-packages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            packages=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
              | grep '^src/[^/]*/' \
              | sed 's|^src/\([^/]*\)/.*|\1|' \
              | sort -u \
              | tr '\n' ' ')
            echo "packages=$packages" >> "$GITHUB_OUTPUT"
          fi

      - name: rosdep install
        run: |
          . /opt/ros/jazzy/setup.sh
          rosdep update || true
          rosdep install --from-paths src --ignore-src -r -y

      - name: Build
        run: |
          . /opt/ros/jazzy/setup.sh
          cmake_args="-DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          packages="${{ steps.changed-packages.outputs.packages }}"
          if [ -n "$packages" ]; then
            colcon build \
              --packages-above-and-up-to $packages \
              --symlink-install \
              --cmake-args $cmake_args \
              --event-handlers console_cohesion+
          else
            colcon build \
              --symlink-install \
              --cmake-args $cmake_args \
              --event-handlers console_cohesion+
          fi

      - name: Lint (fast fail)
        run: |
          . /opt/ros/jazzy/setup.sh
          packages="${{ steps.changed-packages.outputs.packages }}"
          if [ -n "$packages" ]; then
            colcon test \
              --packages-select $packages \
              --ctest-args -R lint_ \
              --event-handlers console_cohesion+
          else
            colcon test \
              --ctest-args -R lint_ \
              --event-handlers console_cohesion+
          fi

      - name: Test (runtime only)
        run: |
          . /opt/ros/jazzy/setup.sh
          packages="${{ steps.changed-packages.outputs.packages }}"
          if [ -n "$packages" ]; then
            colcon test \
              --packages-select $packages \
              --ctest-args -E lint_ \
              --event-handlers console_cohesion+
          else
            colcon test \
              --ctest-args -E lint_ \
              --event-handlers console_cohesion+
          fi

      - name: Test results
        if: always()
        run: |
          . /opt/ros/jazzy/setup.sh
          if [ -d build ]; then colcon test-result --verbose; else echo "No build directory found - skipping test results"; fi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: colcon-test-results
          path: |
            build/**/test_results/**
            log/**/**
