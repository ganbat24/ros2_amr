name: CI

on: [push, pull_request]

jobs:
  ci:
    runs-on: ubuntu-24.04
    # Professional safety net, not a target: individual steps are the ones
    # designed to be fast (see the nav smoke test's own comment below for
    # measured timing). This just stops a genuinely stuck job from burning
    # Actions minutes for hours.
    timeout-minutes: 20
    container:
      image: ros:jazzy-ros-base-noble
      env:
        # GPU-less runner: force Mesa software rendering (llvmpipe) so
        # Gazebo's gpu_lidar sensor can create a GL context headless.
        LIBGL_ALWAYS_SOFTWARE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache rosdep
        uses: actions/cache@v6
        with:
          path: ~/.ros/rosdep
          key: rosdep-${{ runner.os }}-jazzy
          restore-keys: |
            rosdep-${{ runner.os }}-jazzy-

      - name: Cache colcon
        uses: actions/cache@v6
        with:
          path: ~/.colcon
          key: colcon-${{ runner.os }}-jazzy-${{ hashFiles('src/**/CMakeLists.txt') }}
          restore-keys: |
            colcon-${{ runner.os }}-jazzy-

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-jazzy-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-jazzy-

      - name: Install system dependencies
        run: |
          set -e
          apt-get update
          apt-get install -y \
            ccache \
            curl \
            git \
            gnupg \
            lsb-release \
            libegl-mesa0 \
            libgl1-mesa-dri \
            python3-rosdep \
            python3-colcon-common-extensions \
            python3-pip \
            python3-pytest \
            python3-yaml
          apt-get update
          apt-get install -y \
            ros-jazzy-ros-gz \
            ros-jazzy-gz-ros2-control

      - name: Configure ccache
        run: |
          ccache --max-size=1G
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: Overlay gz_ros2_control (jazzy-branch fix)
        # The 1.2.19 binary segfaults at the first controller read
        # (upstream bug); the jazzy branch carries the fix. Build the
        # pinned tip (plus the empty-data guard patch, see
        # docker/patches/) into the workspace so CI runs the same code
        # the Docker image ships.
        run: |
          git init src/gz_ros2_control
          cd src/gz_ros2_control
          git remote add origin https://github.com/ros-controls/gz_ros2_control.git
          git fetch --depth 1 origin 4047614cfa89d8b77df68d64859d95c3288a3a2e
          git checkout --detach FETCH_HEAD
          git apply /__w/ros2_amr/ros2_amr/docker/patches/gz_ros2_control-empty-data-guard.patch

      - name: rosdep install
        run: |
          . /opt/ros/jazzy/setup.sh
          rosdep update || true
          rosdep install --from-paths src --ignore-src -r -y

      - name: Build
        run: |
          . /opt/ros/jazzy/setup.sh
          cmake_args="-DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          colcon build \
            --symlink-install \
            --cmake-args $cmake_args \
            --event-handlers console_cohesion+

      - name: Lint (fast fail)
        run: |
          . /opt/ros/jazzy/setup.sh
          . ./install/setup.sh
          colcon test \
            --packages-skip gz_ros2_control gz_ros2_control_tests gz_ros2_control_demos \
            --ctest-args -R lint_ \
            --event-handlers console_cohesion+

      - name: Test (runtime only)
        run: |
          . /opt/ros/jazzy/setup.sh
          # workspace install must be on the ament path: the launch tests
          # xacro the URDF, which resolves $(find amr_control) and friends
          . ./install/setup.sh
          # gz_ros2_control{, _tests, _demos} are the VENDORED overlay
          # (built from the pinned jazzy tip + guard patch): its own tests
          # need gz sim / upstream tooling and are not this repo's
          # responsibility — the Build step still compiles them. Test only
          # the 7 amr packages.
          colcon test \
            --packages-skip gz_ros2_control gz_ros2_control_tests gz_ros2_control_demos \
            --ctest-args -E lint_ \
            --event-handlers console_cohesion+

      - name: Test results
        if: always()
        run: |
          . /opt/ros/jazzy/setup.sh
          if [ -d build ]; then colcon test-result --verbose; else echo "No build directory found - skipping test results"; fi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: colcon-test-results
          path: |
            build/**/test_results/**
            log/**/**

      # Everything above this line checks config SHAPE (params load, plugins
      # register, lifecycle order) -- none of it launches Gazebo or asserts
      # a goal is reached. That gap is real: a broken nav2_params.yaml could
      # merge here and stay green. This step is the first one that actually
      # drives the robot.
      #
      # Deliberately ONE goal, not the four-goal tour amr_metrics can run
      # locally (`orchestrate --campaign N`) -- this is a smoke test (did the
      # stack come up and navigate at all), not a performance benchmark, and
      # GH Actions runners don't have the cores to make timing numbers from
      # here mean anything anyway (see docker/docker-compose.yml's own note
      # on this). g2_top_left is picked because it's the fastest goal
      # measured across every arm in this project's method-comparison
      # campaign (2026-08-19) -- reaches real map area (crosses no doors,
      # unlike g1/g3, so it stays a meaningful nav test, just a short one).
      #
      # Measured 2026-08-19 on a 2-core container matching this runner's
      # class (not this exact runner -- can't benchmark GH Actions directly
      # without a real run): teardown ~9s, launch+drive-chain-ready ~22s,
      # g2_top_left itself ~43s. Budget the step timeout well above that to
      # absorb real GH Actions variance, not to encourage it to run long.
      - name: Navigation smoke test
        timeout-minutes: 8
        run: |
          . /opt/ros/jazzy/setup.sh
          . ./install/setup.sh
          ros2 run amr_metrics orchestrate --teardown || true
          ros2 run amr_metrics orchestrate --launch --wait-ready --headless true --launch-timeout 240
          ros2 run amr_metrics run_validation --goals g2_top_left --out-dir /tmp/ci_nav_smoke --per-goal-timeout 180 --no-plot

      - name: Teardown navigation stack
        if: always()
        run: |
          . /opt/ros/jazzy/setup.sh
          . ./install/setup.sh 2>/dev/null || true
          ros2 run amr_metrics orchestrate --teardown || true

      - name: Upload navigation smoke test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nav-smoke-test-results
          path: /tmp/ci_nav_smoke/**
          if-no-files-found: ignore
